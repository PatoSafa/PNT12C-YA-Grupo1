# Base de datos PostgreSQL para desarrollo local. Uso: docker compose up -d
# Las credenciales son solo de desarrollo y coinciden con appsettings.Development.json.
services:
  postgres:
    image: postgres:17
    container_name: cenaapp-postgres
    environment:
      POSTGRES_DB: cenaapp
      POSTGRES_USER: cenaapp
      POSTGRES_PASSWORD: cenaapp_dev
    ports:
      - "5432:5432"
    volumes:
      - cenaapp-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cenaapp -d cenaapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cenaapp-datos:
