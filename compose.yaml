# Base de datos PostgreSQL para desarrollo local. Uso: docker compose up -d
# Las credenciales son solo de desarrollo y coinciden con appsettings.Development.json.
services:
  postgres:
    image: postgres:17
    container_name: cocinafacil-postgres
    environment:
      POSTGRES_DB: cocinafacil
      POSTGRES_USER: cocinafacil
      POSTGRES_PASSWORD: cocinafacil_dev
    ports:
      - "5432:5432"
    volumes:
      - cocinafacil-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocinafacil -d cocinafacil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cocinafacil-datos:
